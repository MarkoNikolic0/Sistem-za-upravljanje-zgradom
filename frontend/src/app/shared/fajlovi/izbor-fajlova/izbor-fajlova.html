<input #polje type="file" hidden multiple [accept]="tipovi()" (change)="izaberi(polje)" />
<button
  pButton
  type="button"
  size="small"
  outlined
  [disabled]="otpremanje()"
  [attr.aria-describedby]="greskaId() ? pomocId + ' ' + greskaId() : pomocId"
  (click)="polje.click()"
>
  @if (otpremanje()) {
    <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
    Otpremanje…
  } @else {
    {{ oznaka() }}
  }
</button>
<p [id]="pomocId" class="mt-2 text-sm text-priguseno">{{ pomoc() }}</p>
