<section class="odeljak" aria-labelledby="potvrda-naslov">
  <div class="zaglavlje-odeljka">
    <h2 id="potvrda-naslov" class="naslov-odeljka">Potvrda</h2>
  </div>
  <p class="text-priguseno">Serviser je označio kvar kao rešen. Proveri da li sve radi.</p>
  @if (kvar().rokPotvrde; as rok) {
    <p class="mt-2 text-sm text-priguseno">
      Ako ne odgovoriš do {{ rok | date: 'd. MMM y.' }}, kvar će se sam zatvoriti.
    </p>
  }
  <div class="mt-4 flex flex-wrap gap-2">
    <button
      pButton
      type="button"
      size="small"
      [disabled]="store.akcijaUToku()"
      (click)="store.potvrdi()"
    >
      Potvrdi da je rešeno
    </button>
    <button
      pButton
      id="nije-reseno"
      type="button"
      size="small"
      severity="secondary"
      outlined
      [attr.aria-expanded]="nijeResenoOtvoreno()"
      (click)="prebaciNijeReseno()"
    >
      Nije rešeno
    </button>
  </div>

  @if (nijeResenoOtvoreno()) {
    <app-forma-razloga
      class="mt-6"
      oznaka="Šta i dalje ne radi?"
      pomoc="Kvar se vraća serviseru, a tvoj odgovor se upisuje u komentare."
      porukaGreske="Napiši šta i dalje ne radi."
      natpis="Pošalji"
      [slanje]="store.akcijaUToku()"
      (posalji)="store.vrati($event)"
      (odustani)="odustaniNijeReseno()"
    />
  }
</section>
