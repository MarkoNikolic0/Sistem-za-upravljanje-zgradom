<section class="odeljak" aria-labelledby="moj-rad-naslov">
  <div class="zaglavlje-odeljka">
    <h2 id="moj-rad-naslov" class="naslov-odeljka">Moj rad</h2>
  </div>
  @if (kvar().status === 'dodeljen') {
    <p class="text-priguseno">Kad počneš popravku, označi to ovde.</p>
    <button
      pButton
      type="button"
      size="small"
      class="mt-4"
      [disabled]="store.akcijaUToku()"
      (click)="store.promeniStatus('u_toku')"
    >
      Počni rad
    </button>
  } @else {
    @if (store.poslednjeVracanje(); as vracanje) {
      <app-razlog-promene class="mt-4" [promena]="vracanje" />
      <p class="mt-4 text-priguseno">Kad ga popraviš, ponovo ga označi kao rešen.</p>
    } @else {
      <p class="text-priguseno">Kad završiš popravku, označi kvar kao rešen.</p>
    }
    <button
      pButton
      type="button"
      size="small"
      class="mt-4"
      [disabled]="store.akcijaUToku()"
      (click)="store.promeniStatus('resen')"
    >
      Označi kao rešen
    </button>
  }

  <app-dolazak-servisera class="mt-8" [kvar]="kvar()" />
</section>
