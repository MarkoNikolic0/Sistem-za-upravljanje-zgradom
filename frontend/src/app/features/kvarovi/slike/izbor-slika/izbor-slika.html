<input #polje type="file" hidden multiple [accept]="tipovi" (change)="izaberi(polje)" />
<button
  pButton
  id="dodaj-slike"
  type="button"
  size="small"
  outlined
  [disabled]="otpremanje()"
  [attr.aria-describedby]="greskaId() ? 'slike-pomoc ' + greskaId() : 'slike-pomoc'"
  (click)="polje.click()"
>
  @if (otpremanje()) {
    <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
    Otpremanje…
  } @else {
    Dodaj slike
  }
</button>
<p id="slike-pomoc" class="mt-2 text-sm text-priguseno">{{ pomoc }}</p>
