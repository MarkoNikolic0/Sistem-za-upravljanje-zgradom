<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <p-card class="w-full max-w-md shadow-lg">
    <div class="flex flex-col gap-1 mb-6">
      <h1 class="text-2xl font-semibold text-slate-800">Prijava</h1>
      <p class="text-sm text-slate-500">Uloguj se u sistem za upravljanje zgradom</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      <p-floatlabel variant="on">
        <input pInputText id="email" formControlName="email" type="email" class="w-full" autocomplete="email" />
        <label for="email">Email</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-iconfield>
          <input pInputPassword id="lozinka" formControlName="lozinka" [type]="prikaziLozinku() ? 'text' : 'password'" class="w-full" autocomplete="current-password" />
          <p-inputicon [class]="prikaziLozinku() ? 'pi pi-eye-slash' : 'pi pi-eye'" (click)="prikaziLozinku.set(!prikaziLozinku())" />
        </p-iconfield>
        <label for="lozinka">Lozinka</label>
      </p-floatlabel>

      @if (greska()) {
        <p-message severity="error">{{ greska() }}</p-message>
      }

      <button pButton type="submit" [disabled]="loginForm.invalid" class="w-full justify-center">
        Prijavi se
      </button>
    </form>

    <p class="text-center mt-6 text-sm text-slate-500">
      Nemaš nalog? <a routerLink="/register" class="text-blue-600 font-medium hover:underline">Registruj se</a>
    </p>
  </p-card>
</div>
